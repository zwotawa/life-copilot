<mat-card>
  <mat-card-title>Register</mat-card-title>

  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="registerRequest.email" required/>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Choose Password</mat-label>
    <input matInput type="password" [(ngModel)]="registerRequest.password" required minlength="8" #password="ngModel"/>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Display Name</mat-label>
    <input matInput [(ngModel)]="registerRequest.displayName" required/>
  </mat-form-field>

  <div *ngIf="error" class="error-text">{{ error }}</div>
  <div *ngIf="(password.invalid && (password.dirty || password.touched))">
    <div *ngIf="password.hasError('minlength')">Password must be at least 8 characters.</div>

  </div>

  <button mat-raised-button color="primary" (click)="register()">
    <span class="spinner">
      <span>Register</span>
      <mat-spinner *ngIf="loading" class="button-spinner" diameter="25" color="warn"></mat-spinner>
    </span>
  </button>

  <a routerLink="/login">Return to Login</a>
</mat-card>

<article class="goal-card" *ngIf="goal">
  <div class="goal-card__header">
    <h3>{{ goal.title }}</h3>
    <div class="goal-card__badges">
      <span>{{ goal.lane }}</span>
      <span>{{ goal.type }}</span>
      <span>{{ goal.status }}</span>
    </div>
  </div>

  <p *ngIf="goal.whyItMatters">{{ goal.whyItMatters }}</p>

  <div *ngIf="goal.currentMilestone">
    <strong>Milestone:</strong> {{ goal.currentMilestone }}
  </div>

  <div *ngIf="goal.nextTinyAction">
    <strong>Next tiny action:</strong> {{ goal.nextTinyAction }}
  </div>

  <div *ngIf="goal.minimumTouchFrequency">
    <strong>Touch frequency:</strong> {{ goal.minimumTouchFrequency }}
  </div>

  <div *ngIf="dueLabel">
    <strong>{{ dueLabel }}</strong>
  </div>
</article>
